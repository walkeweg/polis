<script>
"use strict";
const $=s=>document.querySelector(s);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;};
const app=$("#app");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1700);}
$("#themebtn").onclick=()=>{const c=document.documentElement.getAttribute("data-theme");const d=matchMedia("(prefers-color-scheme:dark)").matches;document.documentElement.setAttribute("data-theme",c?(c==="dark"?"light":"dark"):(d?"light":"dark"));};

/* ---------- Skalen & Kategorien ---------- */
const SCALES={
  consent5:{max:2,hasVeto:true,blockVal:-2,
    opts:[{v:2,g:"++",label:"Volle Zustimmung"},{v:1,g:"+",label:"Zustimmung, kleine Vorbehalte"},{v:0,g:"o",label:"Neutral / enthalte mich"},{v:-1,g:"–",label:"Bedenken"},{v:-2,g:"✕",label:"Einwand (blockiert)"}],
    hint:"Konsent heisst nicht «Mehrheit dafür», sondern «kein schwerwiegender Einwand». Ein einziger Einwand wird eigens markiert."},
  thumb3:{max:1,hasVeto:false,blockVal:null,
    opts:[{v:1,g:"+",label:"Dafür"},{v:0,g:"o",label:"Neutral"},{v:-1,g:"–",label:"Dagegen"}],
    hint:"Schnell und niederschwellig, gut für jüngere Klassen. Richtung und Streuung, aber kein blockierendes Veto."}
};
function scaleColor(v,max){if(max===1){return {1:"var(--boden)",0:"var(--muted)","-1":"var(--umstritten)"}[v];}return {2:"var(--boden)",1:"#7bbf8f",0:"var(--muted)","-1":"var(--umstritten)","-2":"var(--einwand)"}[v];}
const CAT={boden:{label:"Gemeinsamer Boden",color:"var(--boden)",bg:"var(--boden-bg)"},ablehnung:{label:"Getragene Ablehnung",color:"var(--ablehnung)",bg:"var(--ablehnung-bg)"},unentschieden:{label:"Einig, aber unentschieden",color:"var(--unent)",bg:"var(--unent-bg)"},umstritten:{label:"Umstritten",color:"var(--umstritten)",bg:"var(--umstritten-bg)"},einwand:{label:"Einwand offen",color:"var(--einwand)",bg:"var(--einwand-bg)"}};

/* ---------- Statistik (Streuung statt Mittelwert) ---------- */
function statsFor(scale,theses,votes,i){
  const rs=votes.map(v=>v.ratings[i]).filter(r=>r!=null);const sc=SCALES[scale],n=rs.length;
  if(!n)return{n:0};
  const mean=rs.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(rs.reduce((a,b)=>a+(b-mean)*(b-mean),0)/n);
  const x=mean/sc.max, unity=Math.max(0,Math.min(1,1-sd/sc.max));
  const veto=sc.hasVeto?rs.filter(r=>r===sc.blockVal).length:0;
  const dist={};sc.opts.forEach(o=>dist[o.v]=0);rs.forEach(r=>dist[r]++);
  let cat;
  if(veto>0)cat="einwand";
  else if(unity>=0.50&&x>=0.35)cat="boden";
  else if(unity>=0.50&&x<=-0.35)cat="ablehnung";
  else if(unity>=0.50)cat="unentschieden";
  else cat="umstritten";
  return{n,mean,sd,x,unity,veto,dist,cat};
}

/* ---------- Karte ---------- */
function buildMap(scale,theses,votes){
  const stats=theses.map((_,i)=>statsFor(scale,theses,votes,i));
  const ns="http://www.w3.org/2000/svg";
  const W=360,H=344, mL=54,mR=18,mT=20,mB=48;
  const x0=mL,y0=mT,x1=W-mR,y1=H-mB, pw=x1-x0, ph=y1-y0;
  const padX=pw*0.11, padY=ph*0.11;
  const px=x=>x0+padX+((x+1)/2)*(pw-2*padX);
  const py=u=>y0+padY+(1-u)*(ph-2*padY);
  const midX=px(0), thrY=py(0.5);
  const svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.setAttribute("class","map");
  svg.setAttribute("role","img");svg.setAttribute("aria-label","Konsenskarte: Thesen nach Zustimmung und Einigkeit");
  const add=(name,a,parent)=>{const e=document.createElementNS(ns,name);for(const k in a)e.setAttribute(k,a[k]);(parent||svg).append(e);return e;};
  const text=(x,y,s,o)=>{const t=add("text",Object.assign({x,y},o||{}));t.textContent=s;return t;};
  // Zonenflächen, beschnitten auf die abgerundeten Ecken (sonst laufen sie über)
  const defs=add("defs",{});
  add("rect",{x:x0,y:y0,width:pw,height:ph,rx:12},add("clipPath",{id:"kkclip"},defs));
  const zonesG=add("g",{"clip-path":"url(#kkclip)"});
  add("rect",{x:midX,y:y0,width:x1-midX,height:thrY-y0,fill:"var(--boden-bg)"},zonesG);
  add("rect",{x:x0,y:y0,width:midX-x0,height:thrY-y0,fill:"var(--ablehnung-bg)"},zonesG);
  add("rect",{x:x0,y:thrY,width:pw,height:y1-thrY,fill:"var(--umstritten-bg)"},zonesG);
  add("line",{x1:midX,y1:y0,x2:midX,y2:y1,stroke:"var(--line)","stroke-width":1,"stroke-dasharray":"2 4"},zonesG);
  add("line",{x1:x0,y1:thrY,x2:x1,y2:thrY,stroke:"var(--line)","stroke-width":1,"stroke-dasharray":"2 4"},zonesG);
  // Rahmen darüber
  add("rect",{x:x0,y:y0,width:pw,height:ph,fill:"none",stroke:"var(--line)","stroke-width":1,rx:12});
  text((midX+x1)/2,y0+16,"gemeinsamer Boden",{class:"zonelabel","text-anchor":"middle"});
  text((x0+midX)/2,y0+16,"getragene Ablehnung",{class:"zonelabel","text-anchor":"middle"});
  text((x0+x1)/2,y1-9,"umstritten",{class:"zonelabel","text-anchor":"middle"});
  const yUp=(y0+thrY)/2, yLo=(thrY+y1)/2;
  text(x0-12,yUp,"einig",{class:"axlabel","text-anchor":"middle",transform:`rotate(-90 ${x0-12} ${yUp})`});
  text(x0-12,yLo,"uneinig",{class:"axlabel","text-anchor":"middle",transform:`rotate(-90 ${x0-12} ${yLo})`});
  text(x0,y1+24,"← Ablehnung",{class:"axlabel","text-anchor":"start"});
  text(x1,y1+24,"Zustimmung →",{class:"axlabel","text-anchor":"end"});
  const R=11, minD=R*2+3;
  const pts=[];stats.forEach((s,i)=>{if(s.n)pts.push({i,s,x:px(s.x),y:py(s.unity)});});
  for(let it=0;it<80;it++){
    for(let a=0;a<pts.length;a++)for(let b=a+1;b<pts.length;b++){
      const A=pts[a],B=pts[b];let dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||0.01;
      if(d<minD){const p=(minD-d)/2,ux=dx/d,uy=dy/d;A.x-=ux*p;A.y-=uy*p;B.x+=ux*p;B.y+=uy*p;}
    }
    pts.forEach(P=>{P.x=Math.max(x0+R,Math.min(x1-R,P.x));P.y=Math.max(y0+R,Math.min(y1-R,P.y));});
  }
  pts.forEach(P=>{
    if(P.s.veto>0)add("circle",{cx:P.x,cy:P.y,r:R+3.5,fill:"none",stroke:"var(--einwand)","stroke-width":2.2});
    const c=add("circle",{cx:P.x,cy:P.y,r:R,fill:CAT[P.s.cat].color,stroke:"var(--card)","stroke-width":2.5});
    add("title",{},c).textContent=`${P.i+1}. ${theses[P.i]}`;
    text(P.x,P.y+0.5,String(P.i+1),{class:"qlabel","text-anchor":"middle"});
  });
  return{svg,stats};
}
function legend(scale){const lg=el("div","legend");const items=[["boden","Gemeinsamer Boden"],["ablehnung","Getragene Ablehnung"],["unentschieden","Einig, unentschieden"],["umstritten","Umstritten"]];if(SCALES[scale].hasVeto)items.push(["einwand","Einwand offen"]);items.forEach(([k,l])=>{const s=el("span");const d=el("span","dot");d.style.background=CAT[k].color;s.append(d,document.createTextNode(l));lg.append(s);});return lg;}
function readingText(stats,theses){
  const f=document.createDocumentFragment();const by=k=>stats.map((s,i)=>({s,i})).filter(o=>o.s.n&&o.s.cat===k).map(o=>o.i+1);const L=a=>a.length?("These "+a.join(", ")):null;const p=t=>{const e=el("p");e.textContent=t;return e;};
  const boden=by("boden"),umstr=by("umstritten"),ein=by("einwand"),unent=by("unentschieden"),abl=by("ablehnung");
  if(boden.length)f.append(p(`Gemeinsamer Boden liegt bei ${L(boden)}. Hier trägt die Gruppe mit.`));else f.append(p("Noch keine These mit klarem gemeinsamem Boden. Kein Scheitern, sondern ein Befund: Der Dialog steht erst am Anfang."));
  if(abl.length)f.append(p(`Einig in der Ablehnung ist die Gruppe bei ${L(abl)}. Auch das ist Konsent, mit umgekehrtem Vorzeichen.`));
  if(ein.length)f.append(p(`Ein offener Einwand liegt bei ${L(ein)}. Im Konsent-Prinzip blockiert das, egal wie viele zustimmen. Zuerst besprechen: Woran hakt es, und wie liesse sich die These ändern, dass der Einwand entfällt?`));
  if(umstr.length)f.append(p(`Umstritten und gesprächsbedürftig sind ${L(umstr)}. Ein Durchschnitt in der Mitte kann Gleichgültigkeit oder eine gespaltene Gruppe heissen. Diese Thesen stehen unten, weil die Streuung gross ist, nicht weil alle neutral wären.`));
  if(unent.length)f.append(p(`Einig, aber ohne klare Richtung ist die Gruppe bei ${L(unent)}. Frage: Ist die These relevant, oder fehlt Information?`));
  return f;
}
function thesisItem(text,i,s,scale){const sc=SCALES[scale];const li=el("li","titem");const th=el("div","th");const left=el("div");left.append(Object.assign(el("span","qnum"),{textContent:(i+1)+"."}),document.createTextNode(" "+text));const cat=el("span","cat");cat.textContent=CAT[s.cat].label;cat.style.color=CAT[s.cat].color;cat.style.background=CAT[s.cat].bg;th.append(left,cat);li.append(th);const stack=el("div","stack");sc.opts.forEach(o=>{const seg=el("i");seg.style.width=((s.dist[o.v]||0)/s.n*100)+"%";seg.style.background=scaleColor(o.v,sc.max);seg.title=`${o.label}: ${s.dist[o.v]||0}`;stack.append(seg);});li.append(stack);const tags=el("div","disttags");sc.opts.forEach(o=>{if(s.dist[o.v])tags.append(el("span",null,`${o.g} ${o.label}: ${s.dist[o.v]}`));});li.append(tags);return li;}

/* ---------- Supabase ---------- */
let sb=null;
function configured(){return SUPABASE_URL&&SUPABASE_ANON_KEY;}
function initSB(){if(configured()&&window.supabase){sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);return true;}return false;}
function rnd(n,chars){chars=chars||"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";const a=crypto.getRandomValues(new Uint32Array(n));for(let i=0;i<n;i++)s+=chars[a[i]%chars.length];return s;}
function baseURL(){return location.origin+location.pathname;}

/* ---------- Router ---------- */
async function route(){
  if(!configured()){return renderSetup();}
  if(!initSB()){app.innerHTML="";app.append(el("div","card","Supabase-Bibliothek konnte nicht geladen werden. Internetverbindung prüfen."));return;}
  const p=new URLSearchParams(location.search);const code=p.get("s"),key=p.get("k");
  if(!code)return renderCreate();
  const {data,error}=await sb.from("sessions").select("*").eq("code",code).maybeSingle();
  if(error||!data){app.innerHTML="";app.append(el("div","card","Diese Runde gibt es nicht (mehr). Prüfe den Link."));return;}
  if(key&&key===data.admin_key)return renderAdmin(data);
  return renderVote(data);
}

/* ---------- SETUP (nur wenn Schlüssel fehlen) ---------- */
function renderSetup(){
  app.innerHTML="";
  const c=el("div","card");
  c.append(Object.assign(el("h2",null,"Einmalige Einrichtung"),{style:"font-size:19px;margin-bottom:10px"}));
  c.append(el("p","muted small","Diese Datei braucht einen Ort, an dem die Stimmen online liegen. Das ist in etwa zehn Minuten erledigt und danach nie wieder nötig."));
  const steps=[
    "Auf supabase.com ein kostenloses Konto anlegen und ein neues Projekt erstellen.",
    "Im Projekt links auf «SQL Editor», den folgenden Block einfügen und ausführen:",
    "Danach unter «Project Settings → API» die «Project URL» und den «anon public» Schlüssel kopieren.",
    "Beide oben in dieser Datei bei SUPABASE_URL und SUPABASE_ANON_KEY eintragen, speichern.",
    "Datei auf einen Webspace legen (Schulserver, Netlify, Cloudflare Pages …). Fertig."
  ];
  const ol=el("div");steps.forEach((t,i)=>{const row=el("p");row.style.margin=".5em 0";row.append(Object.assign(el("b",null,(i+1)+". "),{style:"color:var(--accent)"}),document.createTextNode(t));ol.append(row);if(i===1){const pre=el("pre","sql");pre.textContent=SQL;ol.append(pre);}});
  c.append(ol);app.append(c);
}
const SQL=`create table sessions (
  id uuid primary key default gen_random_uuid(),
  code text unique not null,
  title text,
  scale text not null default 'consent5',
  theses jsonb not null,
  admin_key text not null,
  is_open boolean not null default true,
  created_at timestamptz default now()
);
create table votes (
  id uuid primary key default gen_random_uuid(),
  session_id uuid references sessions(id) on delete cascade,
  ratings jsonb not null,
  created_at timestamptz default now()
);
alter table sessions enable row level security;
alter table votes enable row level security;
create policy "read sessions"  on sessions for select using (true);
create policy "make sessions"  on sessions for insert with check (true);
create policy "edit sessions"  on sessions for update using (true);
create policy "read votes"     on votes    for select using (true);
create policy "cast votes"     on votes    for insert with check (true);
create policy "clear votes"    on votes    for delete using (true);
-- Live-Aktualisierung einschalten:
alter publication supabase_realtime add table votes;`;

/* ---------- CREATE ---------- */
function renderCreate(){
  app.innerHTML="";
  const c=el("div","card");
  c.append(Object.assign(el("h2",null,"Neue Runde"),{style:"font-size:19px;margin-bottom:14px"}));
  const name=el("input");name.type="text";name.placeholder="z. B. Regeln fürs Klassenzimmer";
  const th=el("textarea");th.placeholder="Eine These pro Zeile.\nWir beginnen jede Sitzung pünktlich.\nHandys bleiben im Unterricht in der Tasche.";
  const sel=el("select");sel.innerHTML='<option value="consent5">Konsent (5 Stufen, mit Einwand)</option><option value="thumb3">Einfach (3 Stufen)</option>';
  const hint=el("p","hint");hint.textContent=SCALES.consent5.hint;sel.onchange=()=>hint.textContent=SCALES[sel.value].hint;
  const f1=el("label","field");f1.append(el("span",null,"Titel der Runde"),name);
  const f2=el("label","field");f2.append(el("span",null,"Thesen, denen man zustimmen oder widersprechen kann"),th);
  const f3=el("label","field");f3.append(el("span",null,"Skala"),sel);
  c.append(f1,f2,f3,hint);
  const go=el("button","btn","Runde erstellen");go.style.marginTop="16px";
  go.onclick=async()=>{
    const theses=th.value.split("\n").map(t=>t.trim()).filter(Boolean);
    if(!theses.length){toast("Mindestens eine These");return;}
    go.disabled=true;go.textContent="Wird erstellt …";
    const code=rnd(6),admin_key=rnd(16);
    const {error}=await sb.from("sessions").insert({code,title:name.value.trim(),scale:sel.value,theses,admin_key});
    if(error){toast("Fehler beim Erstellen");go.disabled=false;go.textContent="Runde erstellen";return;}
    location.href=baseURL()+"?s="+code+"&k="+admin_key;
  };
  c.append(go);app.append(c);
}

/* ---------- VOTE (Teilnahme-Link, ohne Registrierung) ---------- */
function renderVote(session){
  app.innerHTML="";
  const votedKey="kk_voted_"+session.code;
  if(localStorage.getItem(votedKey)){return renderThanks(session,true);}
  if(!session.is_open){app.append(el("div","card","Diese Runde ist geschlossen. Es kann nicht mehr abgestimmt werden."));return;}
  const sc=SCALES[session.scale];const draft=new Array(session.theses.length).fill(null);
  const head=el("div","card");head.style.marginBottom="14px";
  head.append(Object.assign(el("h2",null,session.title||"Abstimmung"),{style:"font-size:18px"}));
  head.append(el("div","small muted","Deine Stimme ist anonym. Du stimmst einmal ab."));
  app.append(head);
  session.theses.forEach((t,i)=>{
    const q=el("div","qcard");
    const qt=el("div","qtext");qt.append(Object.assign(el("span","qnum"),{textContent:(i+1)+"."}),document.createTextNode(" "+t));q.append(qt);
    const opts=el("div","opts");
    sc.opts.forEach(o=>{const b=el("button","opt");b.type="button";if(o.v<0)b.dataset.neg="1";if(sc.hasVeto&&o.v===sc.blockVal)b.dataset.block="1";b.setAttribute("aria-pressed","false");b.title=o.label;b.append(Object.assign(el("span","g"),{textContent:o.g}));b.append(document.createTextNode(o.label));b.onclick=()=>{draft[i]=o.v;opts.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");upd();};opts.append(b);});
    q.append(opts);app.append(q);
  });
  const bar=el("div","bar noprint");const inner=el("div","inner");const prog=el("div","progress");const send=el("button","btn","Abstimmen");
  inner.append(prog,send);bar.append(inner);document.body.append(bar);
  function upd(){const done=draft.filter(x=>x!=null).length;prog.textContent=`${done} von ${draft.length} beantwortet`;send.disabled=done<draft.length;}
  upd();
  send.onclick=async()=>{send.disabled=true;send.textContent="Sende …";
    const {error}=await sb.from("votes").insert({session_id:session.id,ratings:draft});
    if(error){toast("Senden fehlgeschlagen");send.disabled=false;send.textContent="Abstimmen";return;}
    try{localStorage.setItem(votedKey,"1");}catch(e){}
    bar.remove();renderThanks(session,false);
  };
}
function renderThanks(session,already){
  app.innerHTML="";
  const c=el("div","card center");
  c.append(el("div","big","Danke"));
  c.append(el("p","muted",already?"Du hast bei dieser Runde bereits abgestimmt.":"Deine Stimme ist erfasst."));
  const b=el("button","btn ghost","Ergebnis ansehen");b.style.marginTop="8px";
  b.onclick=()=>renderResultsView(session,false);
  c.append(b);app.append(c);
}

/* ---------- Ergebnis-Ansicht (für Teilnehmende nach dem Voten) ---------- */
async function renderResultsView(session,isAdmin){
  app.innerHTML="";
  const {data:votes}=await sb.from("votes").select("ratings").eq("session_id",session.id);
  drawResults(session,votes||[],isAdmin);
}

/* ---------- ADMIN (Leitungs-Link, live) ---------- */
function renderAdmin(session){
  app.innerHTML="";
  let votes=[];
  const shareURL=baseURL()+"?s="+session.code;

  const linkCard=el("div","card noprint");
  linkCard.append(Object.assign(el("h2",null,session.title||"Runde"),{style:"font-size:19px"}));
  linkCard.append(el("p","small muted","Diesen Link oder QR-Code verteilen. Wer ihn öffnet, stimmt einmal ab, ohne Anmeldung."));
  const lb=el("div","linkbox");const inp=el("input");inp.type="text";inp.readOnly=true;inp.value=shareURL;const cp=el("button","btn small","Kopieren");cp.onclick=()=>{inp.select();navigator.clipboard&&navigator.clipboard.writeText(shareURL);toast("Link kopiert");};lb.append(inp,cp);linkCard.append(lb);
  const qr=el("div","qrbox");linkCard.append(qr);
  try{if(window.QRCode){new QRCode(qr,{text:shareURL,width:172,height:172,correctLevel:QRCode.CorrectLevel.M});}}catch(e){}
  const ctrl=el("div","row");ctrl.style.marginTop="14px";
  const closeBtn=el("button","btn ghost small",session.is_open?"Runde schliessen":"Runde öffnen");
  closeBtn.onclick=async()=>{const ns=!session.is_open;await sb.from("sessions").update({is_open:ns}).eq("code",session.code);session.is_open=ns;closeBtn.textContent=ns?"Runde schliessen":"Runde öffnen";toast(ns?"Runde offen":"Runde geschlossen");};
  const resetBtn=el("button","btn danger small","Stimmen zurücksetzen");
  resetBtn.onclick=async()=>{if(!confirm("Alle Stimmen dieser Runde löschen?"))return;await sb.from("votes").delete().eq("session_id",session.id);toast("Stimmen gelöscht");};
  const printBtn=el("button","btn ghost small","Drucken / PDF");printBtn.onclick=()=>window.print();
  ctrl.append(closeBtn,resetBtn,printBtn);linkCard.append(ctrl);
  app.append(linkCard);

  const resultsHost=el("div");app.append(resultsHost);
  async function refresh(){const {data}=await sb.from("votes").select("ratings").eq("session_id",session.id);votes=data||[];const host=el("div");drawResults(session,votes,true,host);resultsHost.replaceChildren(host);}
  refresh();
  // Live: neue Stimmen sofort einrechnen
  sb.channel("votes-"+session.id).on("postgres_changes",{event:"*",schema:"public",table:"votes",filter:"session_id=eq."+session.id},()=>refresh()).subscribe();
}

/* ---------- Ergebnis rendern (gemeinsam für Admin & Teilnehmende) ---------- */
function drawResults(session,votes,isAdmin,host){
  host=host||app;if(host===app)app.innerHTML="";
  const {scale,theses}=session;const voted=votes.length;
  const head=el("div","card");
  const hr=el("div","row spread");
  const hl=el("div");hl.append(Object.assign(el("h3",null,isAdmin?"Karte (live)":"Ergebnis"),{style:"font-size:17px"}));
  const l=el("div","live");if(isAdmin){l.append(el("span","pulse"));}l.append(document.createTextNode(`${voted} Stimme${voted!==1?"n":""}`));hl.append(l);hr.append(hl);
  head.append(hr);
  if(!voted){head.append(el("p","hint","Noch keine Stimmen. Sobald abgestimmt wird, erscheint die Karte."));host.append(head);return;}
  const {svg,stats}=buildMap(scale,theses,votes);
  const cnt={};Object.keys(CAT).forEach(k=>cnt[k]=0);stats.forEach(s=>{if(s.n)cnt[s.cat]++;});
  const kpis=el("div","kpis");const kpi=(n,t,col)=>{const d=el("div","kpi");const b=el("b",null,n);if(col)b.style.color=col;d.append(b,el("span",null,t));return d;};
  kpis.append(kpi(cnt.boden,"gemeinsamer Boden","var(--boden)"),kpi(cnt.umstritten,"umstritten","var(--umstritten)"));
  if(SCALES[scale].hasVeto)kpis.append(kpi(cnt.einwand,"mit offenem Einwand","var(--einwand)"));
  head.append(kpis);host.append(head);

  const mapCard=el("div","card");mapCard.append(svg,legend(scale));
  mapCard.append(Object.assign(el("p","small muted"),{textContent:"Waagrecht: Ablehnung ↔ Zustimmung. Senkrecht: wie einig die Gruppe ist. Oben rechts trägt die Gruppe. Unten heisst uneinig, unabhängig vom Durchschnitt.",style:"margin-top:10px"}));
  host.append(mapCard);

  const rd=el("div","card reading");rd.append(Object.assign(el("h3",null,"Lesart"),{style:"font-size:15px;margin-bottom:8px"}));rd.append(readingText(stats,theses));host.append(rd);

  const det=el("div","card");det.append(Object.assign(el("h3",null,"Thesen im Detail"),{style:"font-size:15px;margin-bottom:6px"}));
  const ul=el("ul","tlist");const order=["einwand","umstritten","unentschieden","ablehnung","boden"];
  theses.map((t,i)=>({t,i,s:stats[i]})).filter(o=>o.s.n).sort((a,b)=>order.indexOf(a.s.cat)-order.indexOf(b.s.cat)).forEach(o=>ul.append(thesisItem(o.t,o.i,o.s,scale)));
  det.append(ul);host.append(det);
}

/* ---------- Los ---------- */
route();
</script>
